[build]
  base    = "understanding-ai"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "../netlify/functions"

# Explicit redirect so /api/chat works in all deploy contexts
# (production, deploy previews, branch deploys)
[[redirects]]
  from   = "/api/chat"
  to     = "/.netlify/functions/chat"
  status = 200

# index.html — never cache so browsers always get the latest chunk manifest
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Vite-hashed assets — safe to cache forever (filename changes on every build)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
